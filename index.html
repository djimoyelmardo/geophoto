<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>GéoPhoto – prototype étape 1</title>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
<style>
  :root{
    --bg:#f4f6f3; --card:#ffffff; --ink:#17201a; --muted:#5b6a60; --line:#d9e0da;
    --accent:#166534; --accent-ink:#ffffff; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101612; --card:#19211c; --ink:#e7efe9; --muted:#9aaba0; --line:#2b372f;
           --accent:#22a355; --accent-ink:#06130a; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto}
  h1{font-size:1.25rem;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
  .k{font-size:.75rem;color:var(--muted)}
  .v{font-variant-numeric:tabular-nums;font-weight:600;word-break:break-word}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;
         border:1px solid currentColor}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
  input[type=text],textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);
       background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:70px;resize:vertical}
  .check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.9rem;color:var(--ink)}
  button,.btn{display:block;width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);
       background:var(--card);color:var(--ink);font:inherit;font-weight:600;text-align:center;
       text-decoration:none;cursor:pointer;margin-top:10px}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px} .row > *{flex:1}
  .item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:0}
  .item img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}
  .item .meta{font-size:.82rem;min-width:0;flex:1}
  .item .meta b{display:block;font-size:.85rem;word-break:break-all}
  .item .acts{display:flex;gap:12px;margin-top:6px}
  .item .acts a,.item .acts button{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:.85rem}
  .item .acts button{color:var(--bad)}
  #msg{font-size:.85rem;color:var(--muted);min-height:1.2em;margin-top:8px}
  .empty{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>GéoPhoto</h1>
  <p class="sub">Prototype étape 1 : photo, position, Lambert-93, EXIF, GeoJSON</p>

  <section class="card">
    <h2>Position</h2>
    <div id="gpsOff">
      <p class="empty" style="margin:0">Le GPS n'est pas encore activé.</p>
      <button class="primary" id="btnGps">Activer le GPS</button>
    </div>
    <div id="gpsOn" hidden>
      <p style="margin:0 0 10px"><span id="accBadge" class="badge bad">en attente…</span>
         <span class="k" id="fixInfo"></span></p>
      <div class="grid">
        <div><div class="k">X Lambert-93 (m)</div><div class="v" id="vx">–</div></div>
        <div><div class="k">Y Lambert-93 (m)</div><div class="v" id="vy">–</div></div>
        <div><div class="k">Latitude WGS84</div><div class="v" id="vlat">–</div></div>
        <div><div class="k">Longitude WGS84</div><div class="v" id="vlon">–</div></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Nouvelle photo</h2>
    <label for="auteur">Auteur</label>
    <input type="text" id="auteur" autocomplete="name" placeholder="Votre nom">
    <label for="comment">Commentaire</label>
    <textarea id="comment" placeholder="Ce que montre la photo…"></textarea>
    <label class="check"><input type="checkbox" id="burn" checked> Incruster les coordonnées sur l'image</label>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <button class="primary" id="btnShoot">Prendre la photo</button>
    <div id="msg"></div>
  </section>

  <section class="card">
    <h2>Photos de la session (<span id="count">0</span>)</h2>
    <div id="list"><p class="empty" style="margin:0">Aucune photo pour l'instant.</p></div>
    <div class="row">
      <button id="btnGeojson" disabled>Télécharger le GeoJSON</button>
      <button id="btnShare" disabled>Partager / mail</button>
    </div>
  </section>
</main>

<script>
/* PURE-START : fonctions sans DOM, testées hors navigateur */
const L93 = '+proj=lcc +lat_0=46.5 +lon_0=3 +lat_1=49 +lat_2=44 +x_0=700000 +y_0=6600000 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs';

// Emprise de validité de l'EPSG:2154 (France métropolitaine)
function inL93Zone(lon, lat){ return lon >= -9.86 && lon <= 10.38 && lat >= 41.15 && lat <= 51.56; }

function toL93(lon, lat){
  if(!inL93Zone(lon, lat)) return null;
  const p = proj4('EPSG:4326', L93, [lon, lat]);
  return { x: Math.round(p[0]*100)/100, y: Math.round(p[1]*100)/100 };
}

// Degrés décimaux -> rationnels EXIF degrés/minutes/secondes (1/10000 de seconde)
function toDMS(deg){
  const total = Math.round(Math.abs(deg) * 3600 * 10000);
  const d = Math.floor(total / 36000000);
  const m = Math.floor((total - d*36000000) / 600000);
  const s = total - d*36000000 - m*600000;
  return [[d,1],[m,1],[s,10000]];
}

function pad(n){ return String(n).padStart(2,'0'); }

function asciiOnly(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'?');
}

// Moyenne pondérée (1/précision²) des meilleurs relevés récents
function bestPosition(fixes, now, windowMs){
  let recent = fixes.filter(f => now - f.t <= windowMs);
  if(!recent.length) return null;
  const minAcc = Math.min(...recent.map(f => f.acc));
  recent = recent.filter(f => f.acc <= minAcc * 1.5);
  let sw=0, lat=0, lon=0, alt=0, swAlt=0;
  for(const f of recent){
    const w = 1 / Math.max(f.acc,1)**2;
    sw += w; lat += f.lat*w; lon += f.lon*w;
    if(f.alt != null){ alt += f.alt*w; swAlt += w; }
  }
  return { lat: lat/sw, lon: lon/sw, acc: minAcc, alt: swAlt ? alt/swAlt : null, n: recent.length };
}

// Construit le bloc EXIF (tags GPS + description) à insérer dans le JPEG
function buildExif(pos, date, comment, auteur){
  const gps = {};
  gps[piexif.GPSIFD.GPSVersionID] = [2,3,0,0];
  gps[piexif.GPSIFD.GPSLatitudeRef] = pos.lat >= 0 ? 'N' : 'S';
  gps[piexif.GPSIFD.GPSLatitude] = toDMS(pos.lat);
  gps[piexif.GPSIFD.GPSLongitudeRef] = pos.lon >= 0 ? 'E' : 'W';
  gps[piexif.GPSIFD.GPSLongitude] = toDMS(pos.lon);
  if(pos.alt != null){
    gps[piexif.GPSIFD.GPSAltitudeRef] = pos.alt >= 0 ? 0 : 1;
    gps[piexif.GPSIFD.GPSAltitude] = [Math.round(Math.abs(pos.alt)*100), 100];
  }
  gps[piexif.GPSIFD.GPSMapDatum] = 'WGS-84';
  gps[piexif.GPSIFD.GPSHPositioningError] = [Math.round(pos.acc*100), 100];
  gps[piexif.GPSIFD.GPSDateStamp] = date.getUTCFullYear()+':'+pad(date.getUTCMonth()+1)+':'+pad(date.getUTCDate());
  gps[piexif.GPSIFD.GPSTimeStamp] = [[date.getUTCHours(),1],[date.getUTCMinutes(),1],[date.getUTCSeconds(),1]];

  const local = date.getFullYear()+':'+pad(date.getMonth()+1)+':'+pad(date.getDate())+' '+
                pad(date.getHours())+':'+pad(date.getMinutes())+':'+pad(date.getSeconds());
  const zeroth = {};
  zeroth[piexif.ImageIFD.Software] = 'GeoPhoto prototype';
  zeroth[piexif.ImageIFD.DateTime] = local;
  if(comment) zeroth[piexif.ImageIFD.ImageDescription] = asciiOnly(comment).slice(0, 500);
  if(auteur)  zeroth[piexif.ImageIFD.Artist] = asciiOnly(auteur).slice(0, 100);
  const exif = {};
  exif[piexif.ExifIFD.DateTimeOriginal] = local;
  return piexif.dump({ '0th': zeroth, 'Exif': exif, 'GPS': gps });
}

function toGeoJSON(entries){
  return {
    type: 'FeatureCollection',
    name: 'geophoto',
    features: entries.map(e => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [ +e.p.lon.toFixed(7), +e.p.lat.toFixed(7) ] },
      properties: e.p
    }))
  };
}

function toCSV(entries){
  const cols = ['fichier','date','auteur','commentaire','x_l93','y_l93','lon','lat','precision_m','altitude_m'];
  const esc = v => v == null ? '' : '"' + String(v).replace(/"/g,'""') + '"';
  return [cols.join(';')].concat(entries.map(e => cols.map(c => esc(e.p[c])).join(';'))).join('\r\n');
}
/* PURE-END */

const $ = id => document.getElementById(id);
const fixes = [];
const entries = [];
let watchId = null;

function say(t){ $('msg').textContent = t || ''; }
function fmt(n, d){ return n.toLocaleString('fr-FR', {minimumFractionDigits:d, maximumFractionDigits:d}); }

try{ $('auteur').value = localStorage.getItem('geophoto_auteur') || ''; }catch(e){}
$('auteur').addEventListener('change', () => { try{ localStorage.setItem('geophoto_auteur', $('auteur').value); }catch(e){} });

/* ---------- GPS ---------- */
function startGps(){
  if(!('geolocation' in navigator)){ alert("La géolocalisation n'est pas disponible sur cet appareil."); return; }
  $('gpsOff').hidden = true; $('gpsOn').hidden = false;
  watchId = navigator.geolocation.watchPosition(onFix, onGpsError,
    { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
}
function onFix(g){
  const c = g.coords;
  fixes.push({ lat:c.latitude, lon:c.longitude, acc:c.accuracy, alt:c.altitude, t:Date.now() });
  while(fixes.length && Date.now() - fixes[0].t > 120000) fixes.shift();
  showPosition();
}
function onGpsError(err){
  const b = $('accBadge'); b.className = 'badge bad';
  b.textContent = err.code === 1 ? 'accès refusé' : 'signal indisponible';
  $('fixInfo').textContent = err.code === 1 ? " Autorisez la localisation pour ce site dans les réglages." : '';
}
function showPosition(){
  const p = bestPosition(fixes, Date.now(), 20000);
  if(!p) return;
  const b = $('accBadge');
  b.className = 'badge ' + (p.acc <= 5 ? 'ok' : p.acc <= 15 ? 'warn' : 'bad');
  b.textContent = '± ' + fmt(p.acc, 1) + ' m';
  $('fixInfo').textContent = ' moyenne de ' + p.n + ' relevé' + (p.n > 1 ? 's' : '');
  $('vlat').textContent = p.lat.toFixed(6);
  $('vlon').textContent = p.lon.toFixed(6);
  const l = toL93(p.lon, p.lat);
  $('vx').textContent = l ? fmt(l.x, 2) : 'hors zone';
  $('vy').textContent = l ? fmt(l.y, 2) : 'hors zone';
}
function freshFix(){
  return new Promise(res => navigator.geolocation.getCurrentPosition(
    g => { onFix(g); res(true); }, () => res(false),
    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }));
}
async function positionForCapture(){
  let p = bestPosition(fixes, Date.now(), 30000);
  if(!p){ say('Recherche de la position…'); await freshFix(); p = bestPosition(fixes, Date.now(), 30000); }
  return p;
}

/* ---------- Photo ---------- */
async function loadImage(file){
  if('createImageBitmap' in window){
    try{ return await createImageBitmap(file, { imageOrientation: 'from-image' }); }catch(e){}
  }
  return await new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img); img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function drawBanner(ctx, w, h, lines){
  const bh = Math.max(56, Math.round(h * 0.07));
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, h - bh, w, bh);
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
  let size = Math.round(bh * 0.32);
  const fit = () => { ctx.font = '600 ' + size + 'px system-ui, sans-serif';
                      return Math.max(...lines.map(t => ctx.measureText(t).width)); };
  while(fit() > w - 2*size && size > 9) size--;
  lines.forEach((t, i) => ctx.fillText(t, size, h - bh + bh * (i + 0.5) / lines.length));
}

function dataUrlToBlob(u){
  const bin = atob(u.split(',')[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: 'image/jpeg' });
}

async function handleFile(file){
  try{
    const pos = await positionForCapture();
    if(!pos){ say("Pas de position disponible : photo non enregistrée. Vérifiez le GPS puis réessayez."); return; }
    say('Traitement de la photo…');
    const date = new Date();
    const l93 = toL93(pos.lon, pos.lat);
    const auteur = $('auteur').value.trim();
    const comment = $('comment').value.trim();

    const img = await loadImage(file);
    const MAX = 2560;
    const k = Math.min(1, MAX / Math.max(img.width, img.height));
    const w = Math.round(img.width * k), h = Math.round(img.height * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    const stamp = date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+' '+pad(date.getHours())+':'+pad(date.getMinutes());
    if($('burn').checked){
      drawBanner(ctx, w, h, [
        (l93 ? 'X ' + fmt(l93.x,2) + '   Y ' + fmt(l93.y,2) + '  (Lambert-93)' : 'Hors zone Lambert-93') + '   ± ' + fmt(pos.acc,1) + ' m',
        pos.lat.toFixed(6) + ', ' + pos.lon.toFixed(6) + ' (WGS84)  ·  ' + stamp + (auteur ? '  ·  ' + auteur : '')
      ]);
    }

    const jpeg = cv.toDataURL('image/jpeg', 0.85);
    const withExif = piexif.insert(buildExif(pos, date, comment, auteur), jpeg);
    const blob = dataUrlToBlob(withExif);
    const name = 'photo_' + date.getFullYear()+pad(date.getMonth()+1)+pad(date.getDate())+'_'+
                 pad(date.getHours())+pad(date.getMinutes())+pad(date.getSeconds())+'.jpg';

    entries.push({ name, blob, url: URL.createObjectURL(blob), p: {
      fichier: name, date: date.toISOString(), auteur, commentaire: comment,
      x_l93: l93 ? l93.x : null, y_l93: l93 ? l93.y : null,
      lon: +pos.lon.toFixed(7), lat: +pos.lat.toFixed(7),
      precision_m: +pos.acc.toFixed(1), altitude_m: pos.alt != null ? +pos.alt.toFixed(1) : null
    }});
    $('comment').value = '';
    render();
    say('Photo enregistrée (' + (blob.size/1048576).toFixed(1) + ' Mo, ± ' + fmt(pos.acc,1) + ' m).' +
        (pos.acc > 15 ? ' Attention : précision faible.' : ''));
  }catch(e){
    console.error(e); say('Erreur pendant le traitement : ' + e.message);
  }
}

/* ---------- Liste, export, partage ---------- */
function render(){
  $('count').textContent = entries.length;
  $('btnGeojson').disabled = $('btnShare').disabled = !entries.length;
  const list = $('list'); list.textContent = '';
  if(!entries.length){ const p = document.createElement('p'); p.className='empty'; p.style.margin=0;
    p.textContent = "Aucune photo pour l'instant."; list.appendChild(p); return; }
  entries.forEach((e, i) => {
    const d = document.createElement('div'); d.className = 'item';
    const im = document.createElement('img'); im.src = e.url; im.alt = '';
    const m = document.createElement('div'); m.className = 'meta';
    const b = document.createElement('b'); b.textContent = e.name;
    const t = document.createElement('div');
    t.textContent = (e.p.x_l93 != null ? 'X ' + fmt(e.p.x_l93,2) + ' · Y ' + fmt(e.p.y_l93,2) : e.p.lat + ', ' + e.p.lon) +
                    ' · ± ' + fmt(e.p.precision_m,1) + ' m';
    const c = document.createElement('div'); c.textContent = e.p.commentaire || '';
    const acts = document.createElement('div'); acts.className = 'acts';
    const a = document.createElement('a'); a.href = e.url; a.download = e.name; a.textContent = 'Télécharger';
    const del = document.createElement('button'); del.textContent = 'Supprimer';
    del.onclick = () => { URL.revokeObjectURL(e.url); entries.splice(i,1); render(); };
    acts.append(a, del); m.append(b, t, c, acts); d.append(im, m); list.appendChild(d);
  });
}

function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function mailText(){
  return entries.map(e =>
    e.name + '\n' +
    (e.p.x_l93 != null ? 'X ' + e.p.x_l93 + ' / Y ' + e.p.y_l93 + ' (Lambert-93)\n' : '') +
    'Lat ' + e.p.lat + ' / Lon ' + e.p.lon + ' (WGS84), précision ± ' + e.p.precision_m + ' m\n' +
    (e.p.commentaire ? e.p.commentaire + '\n' : '')
  ).join('\n');
}

async function share(){
  if(!navigator.canShare){ say("Le partage n'est pas disponible dans ce navigateur : téléchargez les fichiers puis joignez-les au mail."); return; }
  const photos = entries.map(e => new File([e.blob], e.name, { type: 'image/jpeg' }));
  const geo = new File([JSON.stringify(toGeoJSON(entries), null, 1)], 'geophoto.geojson', { type: 'application/geo+json' });
  const csv = new File(['\ufeff' + toCSV(entries)], 'geophoto.csv', { type: 'text/csv' });
  // Certains navigateurs refusent le .geojson dans le partage : repli sur CSV, puis photos seules
  const tries = [[...photos, geo], [...photos, csv], photos];
  const files = tries.find(f => navigator.canShare({ files: f }));
  if(!files){ say("Ce navigateur ne sait pas partager des fichiers : téléchargez-les puis joignez-les au mail."); return; }
  try{
    await navigator.share({ files, title: 'Photos géolocalisées', text: mailText() });
    say(files.length === photos.length ? 'Partagé sans fichier de points (non accepté par ce navigateur) : les coordonnées sont dans le texte et dans l\'EXIF.' : 'Partage lancé.');
  }catch(e){ if(e.name !== 'AbortError') say('Partage impossible : ' + e.message); }
}

$('btnGps').onclick = startGps;
$('btnShoot').onclick = () => { if(watchId == null) startGps(); $('file').click(); };
$('file').onchange = ev => { const f = ev.target.files[0]; ev.target.value = ''; if(f) handleFile(f); };
$('btnGeojson').onclick = () => download(new Blob([JSON.stringify(toGeoJSON(entries), null, 1)], { type: 'application/geo+json' }), 'geophoto.geojson');
$('btnShare').onclick = share;
</script>
</body>
</html>
